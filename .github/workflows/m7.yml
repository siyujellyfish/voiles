name: M7 公開語言
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  preview:
    name: P31 發行版能力矩陣
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 核對凍結發行版及五個命令入口
        run: |
          git fetch --depth=1 origin refs/heads/releases/0.1.0-preview.1
          git archive FETCH_HEAD dist | tar -xf - -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/dist"
          echo '7815344827bc2504104029979ab1cd438b32bcb90d1018aff71add2b25b98bd0  voiles-0.1.0-preview.1-linux-x86_64.tar.xz' | sha256sum -c -
          tar -xJf voiles-0.1.0-preview.1-linux-x86_64.tar.xz
          python3 "$GITHUB_WORKSPACE/tools/核對M7公開能力.py" "$PWD/voiles-0.1.0-preview.1-linux-x86_64/voiles"
