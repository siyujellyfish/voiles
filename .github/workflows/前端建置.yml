name: Rust 前端建置與架構測試

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust 前端建置
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 檢查 Rust stable 版本與 Linux x86-64
        run: |
          rustup toolchain install stable --profile minimal
          rustup run stable rustc --version
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
      - name: 直接 rustc 建置 voiles_core rlib 與 voiles 命令
        run: |
          mkdir -p target/p02
          rustup run stable rustc --edition=2021 --crate-name voiles_core --crate-type rlib src/lib.rs -o target/p02/libvoiles_core.rlib
          rustup run stable rustc --edition=2021 --crate-name voiles --extern voiles_core=target/p02/libvoiles_core.rlib -L dependency=target/p02 src/main.rs -o target/p02/voiles
          test -s target/p02/libvoiles_core.rlib
          test -x target/p02/voiles

  test:
    name: Rust 獨立架構測試
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 檢查 Rust stable 版本與 Linux x86-64
        run: |
          rustup toolchain install stable --profile minimal
          rustup run stable rustc --version
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
      - name: 測試工作依 BK06 自行重編 rlib 並執行 Rust 內建測試
        run: |
          mkdir -p target/p02
          rustup run stable rustc --edition=2021 --crate-name voiles_core --crate-type rlib src/lib.rs -o target/p02/libvoiles_core.rlib
          rustup run stable rustc --edition=2021 --crate-name voiles --extern voiles_core=target/p02/libvoiles_core.rlib -L dependency=target/p02 src/main.rs -o target/p02/voiles
          rustup run stable rustc --edition=2021 --test --crate-name p02_smoke --extern voiles_core=target/p02/libvoiles_core.rlib -L dependency=target/p02 tests/rust/p02_smoke.rs -o target/p02/p02_smoke
          VOILES_CLI=./target/p02/voiles ./target/p02/p02_smoke
      - name: P04 執行 Rust 核心內部 UTF-8 與原始座標測試
        run: |
          rustup run stable rustc --edition=2021 --test --crate-name voiles_source_tests src/lib.rs -o target/p02/p04_source_internal
          ./target/p02/p04_source_internal
      - name: P13 人工驗收輔助腳本的 Bash 語法檢查
        run: bash -n tools/人工驗收-P13.sh
      - name: P13 入口 B 與 D01 A／A 容器公開 CLI 隔離回歸
        run: |
          bash -n tools/檢查-P13-公開邊界.sh
          bash tools/檢查-P13-公開邊界.sh ./target/p02/voiles target/p02/p13-public
      - name: P13 六項候選驗收及完整人工驗收腳本實際執行
        run: |
          bash -n tools/核對-P13-驗收證據.sh
          bash tools/人工驗收-P13.sh
          bash tools/核對-P13-驗收證據.sh ./target/p13-accept/internal_tests target/p13-accept
      - name: P14～P16 受限私有模型的獨立候選證據
        run: |
          bash -n tools/核對-P14-P16-工程證據.sh
          bash tools/核對-P14-P16-工程證據.sh ./target/p13-accept/internal_tests target/p13-accept
      - name: P12 產生 49 個真正執行的 P01 正反語意測試並核對 struct 阻塞清單
        run: |
          python3 tools/產生規格測試.py
          python3 tools/檢查P03測試.py
      - name: P12 編譯並執行 49 個獨立 P01 語意驗收案例
        run: |
          rustup run stable rustc --edition=2021 --test --crate-name p03_spec --extern voiles_core=target/p02/libvoiles_core.rlib -L dependency=target/p02 target/p02/p03_spec_generated.rs -o target/p02/p03_spec
          ./target/p02/p03_spec
      - name: 公開 CLI 效能觀測（不設定不穩定的硬性時間門檻）
        run: python3 tools/效能基準.py ./target/p02/voiles --repeat 7 --sizes 128 512 2048
